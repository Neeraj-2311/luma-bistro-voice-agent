[project]
name = "luma-bistro-voice-agent"
version = "1.0.0"
description = "Real-time voice AI reservation agent for Luma Bistro"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[cartesia,deepgram,openai,silero]~=1.6.7",
    "httpx~=0.28",
    "python-dotenv~=1.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.141.1",
    "pytest~=8.3",
    "pytest-asyncio~=1.0",
    "pytest-json-report>=1.5.0",
    "ruff~=0.9",
    "uvicorn>=0.52.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Scenario order matters: each test resets the API, so they must not interleave.
addopts = "-p no:randomly"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `ruff format` owns code layout and never splits string literals, so E501 only
# ever fires on prose that is more readable left alone.
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/luma_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
